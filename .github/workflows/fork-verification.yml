name: Fork Verification

on:
  push:
    branches:
      - main
      - 'codex/merge-librechat-pr17-*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  HUSKY: '0'

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit
      - name: Build all workspaces and frontend
        env:
          # `npm run frontend` reaches client's `prebuild`, which downloads the 33 MB
          # GeoGebra bundle from a third-party CDN. This job checks that the tree
          # compiles, and it should not go red because that CDN is unreachable; the
          # fetched runtime is what the deployment build covers, and it does fetch.
          SKIP_GGB_FETCH: '1'
        run: npm run frontend
      - name: Typecheck all TypeScript workspaces
        shell: bash
        run: |
          result=0
          for workspace in packages/data-provider packages/data-schemas packages/api packages/client client; do
            echo "::group::Typecheck $workspace"
            (cd "$workspace" && npx tsc --noEmit) || result=1
            echo '::endgroup::'
          done
          exit "$result"

  regression:
    name: Regression (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: api
            tests: >-
              server/middleware/__tests__/validateModel.spec.js
              server/middleware/__tests__/validateTurnstile.test.js
              server/routes/__tests__/config.spec.js
              server/services/Config/__tests__/EndpointService.spec.js
              server/services/Config/__tests__/invalidateConfigCaches.spec.js
              server/services/Config/loadCustomConfig.spec.js
              server/services/Config/loadDefaultEConfig.spec.js
              server/services/initializeMCPs.plugins.spec.js
              server/services/initializeMCPs.spec.js
              server/routes/oauth.test.js
          - workspace: packages/data-provider
            tests: src
          - workspace: packages/data-schemas
            tests: >-
              src/app/interface.spec.ts
              src/app/turnstile.spec.ts
              src/models/oauth.spec.ts
          - workspace: packages/api
            tests: >-
              src/admin/config.handler.spec.ts
              src/admin/config.spec.ts
              src/app/AppService.spec.ts
              src/app/environment.spec.ts
              src/endpoints/access.spec.ts
              src/endpoints/config/endpoints.spec.ts
              src/mcp/registry/__tests__/MCPServersRegistry.test.ts
              src/oauth
              src/prompts/widgets
              src/schedules
              src/setup
              src/widgets
          - workspace: client
            tests: >-
              src/components/Auth/__tests__/Registration.turnstile.test.tsx
              src/components/Audio/__tests__/VoicePreview.spec.tsx
              src/components/Chat/__tests__/Footer.spec.tsx
              src/components/Nav/Settings/__tests__
              src/components/Nav/SettingsTabs/General/__tests__
              src/components/Widgets/__tests__
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit
      - name: Build shared workspaces
        run: npm run build:packages
      - name: Run merge regression tests
        working-directory: ${{ matrix.workspace }}
        env:
          NODE_ENV: test
        run: npx jest --ci --runInBand --coverage=false ${{ matrix.tests }}
